<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票短线分析报告 - __STOCK_NAME__ (__STOCK_CODE__)</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root {
  --bg: #f5f6fa;
  --bg-card: #ffffff;
  --bg-hover: #f8f9fc;
  --border: #e8eaf0;
  --text: #1f2937;
  --text-dim: #6b7280;
  --text-bright: #111827;
  --up: #ef4444;
  --down: #10b981;
  --accent: #5b6cff;
  --accent-light: #eef0ff;
  --warning: #f59e0b;
  --warning-light: #fff7ed;
  --danger: #ef4444;
  --danger-light: #fef2f2;
  --success: #10b981;
  --success-light: #ecfdf5;
  --shadow: 0 2px 12px rgba(91, 108, 255, 0.08);
  --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.04);
  --radius: 12px;
  --radius-sm: 8px;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  padding: 0;
  max-width: 1400px;
  margin: 0 auto;
}
header {
  background: linear-gradient(135deg, #5b6cff 0%, #8b5bff 100%);
  border-radius: 0 0 var(--radius) var(--radius);
  padding: 32px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
  box-shadow: var(--shadow);
}
header h1 {
  font-size: 26px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}
header .meta-info {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  font-size: 13px;
  color: rgba(255,255,255,0.85);
}
header .meta-info span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.12);
  padding: 4px 12px;
  border-radius: 20px;
}
header .score-badge {
  text-align: center;
  padding: 18px 32px;
  border-radius: var(--radius);
  background: rgba(255,255,255,0.95);
  box-shadow: var(--shadow-sm);
  min-width: 120px;
}
header .score-badge .score {
  font-size: 42px;
  font-weight: 800;
  color: var(--accent);
  line-height: 1;
}
header .score-badge .label {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 6px;
  font-weight: 500;
}
.main {
  padding: 0 24px 24px;
}
section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
section h2 {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 18px;
  padding-bottom: 0;
  border-bottom: none;
  display: flex;
  align-items: center;
  gap: 10px;
}
section h2 .num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  background: linear-gradient(135deg, #5b6cff 0%, #8b5bff 100%);
  color: #ffffff;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  box-shadow: 0 2px 6px rgba(91, 108, 255, 0.25);
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 14px;
}
.info-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s, box-shadow 0.15s;
}
.info-card:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(91, 108, 255, 0.1);
}
.info-card .key {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 6px;
  font-weight: 500;
}
.info-card .val {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-bright);
  letter-spacing: 0.3px;
}
.info-card .val.up { color: var(--up); }
.info-card .val.down { color: var(--down); }
table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
table th {
  text-align: left;
  padding: 10px 14px;
  background: #f8f9fc;
  color: var(--text-dim);
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
}
table tr:last-child td { border-bottom: none; }
table tr:hover td { background: var(--bg-hover); }
.up-text { color: var(--up); font-weight: 600; }
.down-text { color: var(--down); font-weight: 600; }
.signal-badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}
.signal-badge.bullish { background: var(--danger-light); color: var(--up); }
.signal-badge.bearish { background: var(--success-light); color: var(--down); }
.signal-badge.neutral { background: #f3f4f6; color: var(--text-dim); }
.stars { color: #f59e0b; font-size: 16px; letter-spacing: 2px; }
.stars .dim { color: #e5e7eb; }
.ai-box {
  background: var(--accent-light);
  border: 1px solid rgba(91, 108, 255, 0.18);
  border-radius: var(--radius-sm);
  padding: 18px 20px;
  margin-top: 14px;
}
.ai-box .ai-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: linear-gradient(135deg, #5b6cff 0%, #8b5bff 100%);
  color: #ffffff;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 10px;
}
.ai-box p { color: var(--text); line-height: 1.8; }
.ai-box .key-signals {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.ai-box .key-signals span {
  background: #ffffff;
  border: 1px solid rgba(91, 108, 255, 0.2);
  color: var(--accent);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
}
.news-item {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.news-item:last-child { border-bottom: none; }
.news-item .title { color: var(--text); font-size: 14px; font-weight: 500; }
.news-item .meta { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
.news-item .sentiment-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  margin-left: 8px;
}
.news-item .sentiment-tag.positive { background: var(--danger-light); color: var(--up); }
.news-item .sentiment-tag.negative { background: var(--success-light); color: var(--down); }
.news-item .sentiment-tag.neutral { background: #f3f4f6; color: var(--text-dim); }
.risk-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.risk-item:last-child { border-bottom: none; }
.risk-item .level {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  min-width: 44px;
  text-align: center;
}
.risk-item .level.high { background: var(--danger-light); color: var(--danger); }
.risk-item .level.medium { background: var(--warning-light); color: var(--warning); }
.risk-item .level.low { background: var(--success-light); color: var(--success); }
.risk-item .type { font-weight: 600; color: var(--text-bright); min-width: 90px; }
.risk-item .desc { color: var(--text-dim); flex: 1; }
.scenario-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 14px;
}
.scenario-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}
.scenario-card.strong { border-color: rgba(239, 68, 68, 0.25); background: linear-gradient(180deg, #fff 0%, var(--danger-light) 100%); }
.scenario-card.normal { border-color: rgba(91, 108, 255, 0.25); background: linear-gradient(180deg, #fff 0%, var(--accent-light) 100%); }
.scenario-card.weak { border-color: rgba(16, 185, 129, 0.25); background: linear-gradient(180deg, #fff 0%, var(--success-light) 100%); }
.scenario-card .title { font-weight: 700; font-size: 15px; margin-bottom: 12px; }
.scenario-card.strong .title { color: var(--up); }
.scenario-card.normal .title { color: var(--accent); }
.scenario-card.weak .title { color: var(--down); }
.scenario-card .row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 8px; }
.scenario-card .row .k { color: var(--text-dim); }
.scenario-card .row .v { color: var(--text-bright); font-weight: 600; }
.chart-container {
  margin-top: 18px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--bg-card);
  border: 1px solid var(--border);
}
.not-available {
  text-align: center;
  padding: 40px;
  color: var(--text-dim);
  font-size: 14px;
  background: #f9fafb;
  border-radius: var(--radius-sm);
  border: 1px dashed var(--border);
}
.not-available .icon { font-size: 32px; margin-bottom: 10px; }
.advantage-list, .risk-list {
  list-style: none;
  margin-top: 14px;
}
.advantage-list li, .risk-list li {
  padding: 8px 0 8px 24px;
  position: relative;
  font-size: 14px;
}
.advantage-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 12px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--up);
}
.risk-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 12px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--down);
}
.judgment-box {
  background: linear-gradient(135deg, #f8f9fc 0%, #eef0ff 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 20px 24px;
  margin-top: 14px;
}
.judgment-box .verdict {
  font-size: 22px;
  font-weight: 800;
}
.judgment-box .verdict.bullish { color: var(--up); }
.judgment-box .verdict.bearish { color: var(--down); }
.judgment-box .verdict.neutral { color: var(--warning); }
.watch-points {
  margin-top: 14px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.watch-points span {
  background: #ffffff;
  border: 1px solid rgba(245, 158, 11, 0.3);
  color: var(--warning);
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
}
.level-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 14px;
}
.level-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
}
.level-card .title { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; font-weight: 500; }
.level-card .values { display: flex; gap: 16px; flex-wrap: wrap; }
.level-card .values span { font-size: 17px; font-weight: 700; }
.level-card.resistance .values span { color: var(--up); }
.level-card.support .values span { color: var(--down); }
.concept-tag {
  display: inline-block;
  background: var(--accent-light);
  color: var(--accent);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  margin-left: 6px;
}
footer {
  text-align: center;
  padding: 24px;
  color: var(--text-dim);
  font-size: 12px;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  margin-top: 20px;
  border-radius: var(--radius) var(--radius) 0 0;
}
footer .disclaimer {
  background: var(--danger-light);
  border: 1px solid rgba(239, 68, 68, 0.15);
  border-radius: var(--radius-sm);
  padding: 10px 18px;
  margin-bottom: 12px;
  display: inline-block;
  color: var(--danger);
  font-weight: 500;
}
@media (max-width: 768px) {
  header { padding: 24px; flex-direction: column; text-align: center; }
  .main { padding: 0 16px 16px; }
  section { padding: 18px; }
  .card-grid { grid-template-columns: repeat(2, 1fr); }
  .scenario-grid { grid-template-columns: 1fr; }
  .level-grid { grid-template-columns: 1fr; }
  table { font-size: 12px; }
  table th, table td { padding: 8px 10px; }
}
</style>
</head>
<body>

<header>

<script>
var REPORT_DATA = __DATA_JSON__;

// === 辅助函数 ===
function fmtNum(n, unit) {
  if (n === null || n === undefined) return '--';
  var abs = Math.abs(n);
  if (unit === '亿') {
    return (n / 1e8).toFixed(2) + '亿';
  } else if (unit === '万') {
    return (n / 1e4).toFixed(2) + '万';
  } else if (abs >= 1e12) {
    return (n / 1e12).toFixed(2) + '万亿';
  } else if (abs >= 1e8) {
    return (n / 1e8).toFixed(2) + '亿';
  } else if (abs >= 1e4) {
    return (n / 1e4).toFixed(2) + '万';
  }
  return n.toFixed(2);
}
function fmtPct(pct) {
  if (pct === null || pct === undefined) return '--';
  var s = pct > 0 ? '+' : '';
  return s + pct.toFixed(2) + '%';
}
function fmtPrice(p, sym) {
  if (p === null || p === undefined) return '--';
  return (sym || '') + p.toFixed(2);
}
function clsByChange(n) {
  if (n === null || n === undefined) return '';
  return n > 0 ? 'up' : (n < 0 ? 'down' : '');
}
function textClsByChange(n) {
  if (n === null || n === undefined) return '';
  return n > 0 ? 'up-text' : (n < 0 ? 'down-text' : '');
}
function renderStars(count) {
  if (!count) return '--';
  var s = '';
  for (var i = 0; i < 5; i++) {
    s += i < count ? '\u2605' : '<span class="dim">\u2605</span>';
  }
  return '<span class="stars">' + s + '</span>';
}
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function notAvailable(msg) {
  return '<div class="not-available"><div class="icon">\u26a0</div>' + (msg || '该市场不支持此数据') + '</div>';
}

// === Section 1: 股票基础信息 ===
function renderS1(d) {
  if (!d) { document.getElementById('s1-content').innerHTML = notAvailable(); return; }
  var sym = (REPORT_DATA.meta || {}).currency_symbol || '';
  var html = '<div class="card-grid">';
  var cards = [
    {k: '股票名称', v: escHtml(d.name)},
    {k: '股票代码', v: d.code},
    {k: '所属行业', v: escHtml(d.industry)},
    {k: '当前价格', v: fmtPrice(d.price, sym), cls: clsByChange(d.change_pct)},
    {k: '今日涨跌', v: fmtPct(d.change_pct), cls: clsByChange(d.change_pct)},
    {k: '成交量', v: fmtNum(d.volume, '万')},
    {k: '成交额', v: fmtNum(d.amount, '亿')},
    {k: '换手率', v: d.turnover_rate != null ? d.turnover_rate.toFixed(2) + '%' : '--'},
    {k: '量比', v: d.volume_ratio != null ? d.volume_ratio.toFixed(2) : '--'},
    {k: '市盈率TTM', v: d.pe_ttm != null ? d.pe_ttm.toFixed(1) : '--'},
    {k: '市净率PB', v: d.pb != null ? d.pb.toFixed(2) : '--'},
    {k: '总市值', v: fmtNum(d.total_market_cap, '亿')},
    {k: '流通市值', v: fmtNum(d.circulating_market_cap, '亿')},
    {k: '52周高', v: fmtPrice(d.high_52week, sym)},
    {k: '52周低', v: fmtPrice(d.low_52week, sym)},
    {k: '股息率TTM', v: d.dividend_yield_ttm != null ? d.dividend_yield_ttm.toFixed(2) + '%' : '--'}
  ];
  cards.forEach(function(c) {
    html += '<div class="info-card"><div class="key">' + c.k + '</div><div class="val ' + (c.cls||'') + '">' + c.v + '</div></div>';
  });
  html += '</div>';
  if (d.concepts && d.concepts.length) {
    html += '<div style="margin-top:16px;"><span style="color:var(--text-dim);font-size:13px;">概念板块：</span>';
    d.concepts.forEach(function(c) {
      html += '<span class="concept-tag">' + escHtml(c) + '</span>';
    });
    html += '</div>';
  }
  document.getElementById('s1-content').innerHTML = html;
}

// === Section 2: 行业/板块资金流 ===
function renderS2(d) {

// === ECharts: K线图 ===
function initKLine(c) {
  if (!c || !c.kline_data || !c.kline_data.length) return;
  var el = document.getElementById('chart-kline');
  if (!el) return;
  var chart = echarts.init(el);
  var dates = c.kline_data.map(function(d) { return d.date; });
  var ohlc = c.kline_data.map(function(d) { return [d.open, d.close, d.low, d.high]; });
  var maData = {};
  if (c.ma_data && c.ma_data.dates) {
    ['ma5','ma10','ma20','ma60'].forEach(function(k) {
      if (c.ma_data[k]) maData[k] = c.ma_data[k];
    });
  }
  var series = [{
    name: 'K线',
    type: 'candlestick',
    data: ohlc,
    itemStyle: { color: '#ef4444', color0: '#10b981', borderColor: '#ef4444', borderColor0: '#10b981' }
  }];
  Object.keys(maData).forEach(function(k) {
    series.push({ name: k.toUpperCase(), type: 'line', data: maData[k], smooth: true, lineStyle: { width: 1.5 }, symbol: 'none' });
  });
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
    legend: { data: ['K线'].concat(Object.keys(maData).map(function(k){return k.toUpperCase();})), textStyle: { color: '#6b7280', fontSize: 10 }, top: 0 },
    grid: { left: '8%', right: '5%', top: '15%', bottom: '10%' },
    xAxis: { type: 'category', data: dates, axisLine: { lineStyle: { color: '#e8eaf0' } }, axisLabel: { color: '#6b7280', fontSize: 10 } },
    yAxis: { scale: true, axisLine: { lineStyle: { color: '#e8eaf0' } }, axisLabel: { color: '#6b7280', fontSize: 10 }, splitLine: { lineStyle: { color: '#f3f4f6' } } },
    series: series
  });
  window.addEventListener('resize', function() { chart.resize(); });
}

function initVolume(c) {
  if (!c || !c.volume_data || !c.volume_data.length) {
    if (!c || !c.kline_data || !c.kline_data.length) return;
    c.volume_data = c.kline_data.map(function(d) { return { date: d.date, volume: d.volume, is_up: d.close >= d.open }; });
  }
  var el = document.getElementById('chart-volume');
  if (!el) return;
  var chart = echarts.init(el);
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis' },
    grid: { left: '8%', right: '5%', top: '5%', bottom: '10%' },
    xAxis: { type: 'category', data: c.volume_data.map(function(d){return d.date;}), axisLine: { lineStyle: { color: '#e8eaf0' } }, axisLabel: { color: '#6b7280', fontSize: 10 } },
    yAxis: { axisLine: { lineStyle: { color: '#e8eaf0' } }, axisLabel: { color: '#6b7280', fontSize: 10 }, splitLine: { lineStyle: { color: '#f3f4f6' } } },
    series: [{
      type: 'bar',
      data: c.volume_data.map(function(d) { return { value: d.volume, itemStyle: { color: d.is_up ? '#ef4444' : '#10b981' } }; })
    }]
  });
  window.addEventListener('resize', function() { chart.resize(); });
}

// === ECharts: 资金流向 ===
function initCapitalFlow(c) {
  if (!c || !c.capital_flow_data || !c.capital_flow_data.length) return;
  var el = document.getElementById('chart-capital-flow');
  if (!el) return;
  var chart = echarts.init(el);
  var data = c.capital_flow_data;
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis', formatter: function(p) { return p[0].name + ': ' + (p[0].value/1e8).toFixed(2) + '亿'; } },
    grid: { left: '12%', right: '5%', top: '8%', bottom: '12%' },
    xAxis: { type: 'category', data: data.map(function(d){return d.category;}), axisLine: { lineStyle: { color: '#e8eaf0' } }, axisLabel: { color: '#1f2937', fontSize: 12 } },
    yAxis: { type: 'value', axisLine: { lineStyle: { color: '#e8eaf0' } }, axisLabel: { color: '#6b7280', fontSize: 10, formatter: function(v){return (v/1e8).toFixed(0)+'亿';} }, splitLine: { lineStyle: { color: '#f3f4f6' } } },
    series: [{
      type: 'bar',
      data: data.map(function(d) { return { value: d.net_flow, itemStyle: { color: d.net_flow >= 0 ? '#ef4444' : '#10b981' } }; }),
      barWidth: '50%'
    }]
  });
  window.addEventListener('resize', function() { chart.resize(); });
}

// === ECharts: MACD ===
function initMACD(c) {
  if (!c || !c.macd_data || !c.macd_data.dates || !c.macd_data.dates.length) return;
  var el = document.getElementById('chart-macd');
  if (!el) return;
  var chart = echarts.init(el);
  var d = c.macd_data;
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis' },
    legend: { data: ['DIF','DEA','MACD'], textStyle: { color: '#6b7280', fontSize: 10 }, top: 0 },
    grid: { left: '8%', right: '5%', top: '15%', bottom: '10%' },
    xAxis: { type: 'category', data: d.dates, axisLine: { lineStyle: { color: '#e8eaf0' } }, axisLabel: { color: '#6b7280', fontSize: 10 } },
    yAxis: { axisLine: { lineStyle: { color: '#e8eaf0' } }, axisLabel: { color: '#6b7280', fontSize: 10 }, splitLine: { lineStyle: { color: '#f3f4f6' } } },
    series: [
      { name: 'DIF', type: 'line', data: d.dif, smooth: true, symbol: 'none', lineStyle: { color: '#5b6cff', width: 1.5 } },
      { name: 'DEA', type: 'line', data: d.dea, smooth: true, symbol: 'none', lineStyle: { color: '#f59e0b', width: 1.5 } },
      { name: 'MACD', type: 'bar', data: d.macd.map(function(v) { return { value: v, itemStyle: { color: v >= 0 ? '#ef4444' : '#10b981' } }; }) }
    ]
  });
  window.addEventListener('resize', function() { chart.resize(); });
}

// === ECharts: RSI ===
function initRSI(c) {
  if (!c || !c.rsi_data || !c.rsi_data.dates || !c.rsi_data.dates.length) return;
  var el = document.getElementById('chart-rsi');
  if (!el) return;
  var chart = echarts.init(el);
  var d = c.rsi_data;
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis' },
    legend: { data: ['RSI6','RSI12'], textStyle: { color: '#6b7280', fontSize: 10 }, top: 0 },
    grid: { left: '8%', right: '5%', top: '15%', bottom: '10%' },
    xAxis: { type: 'category', data: d.dates, axisLine: { lineStyle: { color: '#e8eaf0' } }, axisLabel: { color: '#6b7280', fontSize: 10 } },
    yAxis: { min: 0, max: 100, axisLine: { lineStyle: { color: '#e8eaf0' } }, axisLabel: { color: '#6b7280', fontSize: 10 }, splitLine: { lineStyle: { color: '#f3f4f6' } } },
    series: [
      { name: 'RSI6', type: 'line', data: d.rsi6, smooth: true, symbol: 'none', lineStyle: { color: '#ef4444', width: 1.5 } },
      { name: 'RSI12', type: 'line', data: d.rsi12, smooth: true, symbol: 'none', lineStyle: { color: '#5b6cff', width: 1.5 } }
    ],
    markLine: {
      data: [
        { yAxis: 70, lineStyle: { color: '#ef4444', type: 'dashed' }, label: { formatter: '超买 70', color: '#ef4444' } },
        { yAxis: 30, lineStyle: { color: '#10b981', type: 'dashed' }, label: { formatter: '超卖 30', color: '#10b981' } }
      ]
    }
  });
  window.addEventListener('resize', function() { chart.resize(); });
}

// === 初始化 ===
document.addEventListener('DOMContentLoaded', function() {
  var d = REPORT_DATA || {};
  var meta = d.meta || {};

  // Header
  document.getElementById('hdr-name').textContent = meta.stock_name || '';
  document.getElementById('hdr-code').textContent = meta.stock_code || '';
  document.getElementById('hdr-market').textContent = meta.market_label || '';
  document.getElementById('hdr-date').textContent = meta.report_date || '';
  document.getElementById('hdr-industry').textContent = (d.section1_basic && d.section1_basic.industry) ? d.section1_basic.industry : '';
  document.getElementById('footer-date').textContent = meta.report_date || '';

  // Score badge
  if (d.section10_strategy && d.section10_strategy.overall_score != null) {
    document.getElementById('score-badge').style.display = 'block';
    document.getElementById('hdr-score').textContent = d.section10_strategy.overall_score;
  }

  // Render sections
  renderS1(d.section1_basic);
  renderS2(d.section2_sector_flow);
  renderS3(d.section3_stock_flow);
  renderS4(d.section4_technical);
  renderS5(d.section5_volume_price);
  renderS6(d.section6_ai_inference);
  renderS7(d.section7_dragon_tiger);
  renderS8(d.section8_news_sentiment);
  renderS9(d.section9_market_env);
  renderS10(d.section10_strategy);
  renderS11(d.section11_risks);
  renderS12(d.section12_ai_summary);

  // Init charts
  var c = d.charts || {};
  setTimeout(function() {
    initKLine(c);
    initVolume(c);
    initCapitalFlow(c);
    initMACD(c);
    initRSI(c);
  }, 100);
});
</script>
</body>
</html>
